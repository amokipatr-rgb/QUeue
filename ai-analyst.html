<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analyst — SMQSS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-dark: #1a3c2c;
            --green-mid: #2a5a3a;
            --green-light: #e8f5e9;
            --gold: #ffd700;
            --bg: #f0f2f5;
            --white: #ffffff;
            --border: #e4e8ee;
            --text-primary: #0a0f18;
            --text-secondary: #2a3a4e;
            --text-muted: #4a5a6e;
            --red: #e53935;
            --amber: #ef6c00;
            --amber-light: #fff3e0;
            --success: #00a84f;
            --success-light: #e8f5e9;
            --blue: #1565c0;
            --blue-light: #e3f2fd;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --sidebar-width: 256px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; background: var(--bg); min-height: 100vh; display: flex; color: var(--text-primary); -webkit-font-smoothing: antialiased; }
        button, input { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: inherit; }
        .sidebar { width: var(--sidebar-width); background: var(--white); min-height: 100vh; position: fixed; left: 0; top: 0; bottom: 0; padding: 20px 14px; overflow-y: auto; z-index: 100; border-right: 1px solid var(--border); }
        .sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 6px 10px 18px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--green-dark), var(--green-mid)); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .logo-icon svg { width: 20px; height: 20px; }
        .logo-title { font-size: 15px; font-weight: 800; color: var(--green-dark); letter-spacing: -0.01em; }
        .logo-sub { font-size: 10px; font-weight: 600; color: var(--green-mid); text-transform: uppercase; letter-spacing: 0.08em; }
        .nav-section-label { font-size: 9.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; padding: 18px 20px 6px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); border-left: 2px solid transparent; transition: all 0.15s ease; min-height: 44px; user-select: none; }
        .nav-item:hover { background: var(--green-light); color: var(--green-dark); }
        .nav-item.active { background: var(--green-light); color: var(--green-dark); border-left: 2px solid var(--green-dark); font-weight: 700; }
        .nav-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--green-light); flex-shrink: 0; }
        .nav-item.active .nav-icon { background: var(--green-dark); color: white; }
        .nav-item.active .nav-icon svg { stroke: white; }
        .nav-icon svg { width: 15px; height: 15px; }
        .main { flex: 1; margin-left: var(--sidebar-width); padding: 22px 26px 30px; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
        .topbar h1 { font-size: 21px; font-weight: 800; }
        .topbar .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
        .chat-shell { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
        .chat-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--border); }
        .chat-controls label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .date-input { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; min-height: 44px; background: var(--white); }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 18px 0; }
        .chip { font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; min-height: 38px; transition: all 0.15s; color: var(--text-secondary); }
        .chip:hover { border-color: var(--green-dark); color: var(--green-dark); background: var(--green-light); }
        .chip:active { transform: scale(0.97); }
        .chat-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 200px; }
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 14px; font-size: 13.5px; line-height: 1.65; animation: fadein 0.25s ease; word-wrap: break-word; }
        @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .msg.user { align-self: flex-end; background: var(--green-dark); color: #fff; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background: var(--bg); color: var(--text-secondary); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .msg.ai p { margin-bottom: 8px; }
        .msg.ai p:last-child { margin-bottom: 0; }
        .msg.ai ul { margin: 6px 0 8px 18px; }
        .msg.ai li { margin-bottom: 4px; }
        .msg-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 6px; font-weight: 600; }
        .msg.user .msg-meta { color: rgba(255,255,255,0.75); }
        .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
        .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: blink 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
        .chat-input { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); }
        .chat-input input { flex: 1; padding: 10px 16px; border: 1px solid var(--border); border-radius: 24px; font-size: 13.5px; min-height: 48px; background: var(--bg); }
        .chat-input input:focus { outline: none; border-color: var(--green-dark); background: var(--white); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 22px; border-radius: 24px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; min-height: 48px; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-primary { background: var(--green-dark); color: #fff; }
        .btn-primary:hover { filter: brightness(1.15); }
        #toastContainer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .toast { background: var(--green-dark); color: #fff; padding: 11px 22px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.12); animation: toastin 0.25s ease; max-width: 92vw; }
        .toast.error { background: var(--red); }
        @keyframes toastin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .toast.hiding { opacity: 0; transition: opacity 0.28s; }
        @media (max-width: 860px) { .sidebar { display: none; } .main { margin-left: 0; padding: 16px 14px 24px; } .msg { max-width: 94%; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
            <div><div class="logo-title">SMQSS</div><div class="logo-sub">Accountability</div></div>
        </div>
        <div class="nav-section-label">System</div>
        <div class="nav-item" onclick="goBackToAdmin()">
            <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg></div>
            <span>Back to Dashboard</span>
        </div>
        <div class="nav-section-label">Accountability</div>
        <div class="nav-item" onclick="goToSLA()">
            <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
            <span>SLA Dashboard</span>
        </div>
        <div class="nav-item" onclick="goToCustomers()">
            <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
            <span>Customers</span>
        </div>
        <div class="nav-item" onclick="goToBenchmarks()">
            <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div>
            <span>Benchmarks</span>
        </div>
        <div class="nav-item" onclick="goToBottlenecks()">
            <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="16" y1="12" x2="12" y2="12"/></svg></div>
            <span>Bottlenecks</span>
        </div>
        <div class="nav-item" onclick="goToReports()">
            <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
            <span>Reports</span>
        </div>
        <div class="nav-item active">
            <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
            <span>AI Analyst</span>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h1>AI Analyst</h1>
            <div class="sub">Ask about staff, services, peak times, breaches, complaints. Every answer is built from live system figures only.</div>
        </div>

        <div class="chat-shell">
            <div class="chat-controls">
                <label for="aiFrom">From</label>
                <input type="date" class="date-input" id="aiFrom">
                <label for="aiTo">To</label>
                <input type="date" class="date-input" id="aiTo">
                <span id="aiPeriodLbl" style="font-size:12px;color:var(--text-muted);font-weight:600"></span>
            </div>
            <div class="chips" id="aiChips">
                <button class="chip" onclick="askChip(this)">Who is the best employee this period?</button>
                <button class="chip" onclick="askChip(this)">Which service is busiest?</button>
                <button class="chip" onclick="askChip(this)">When are our peak hours?</button>
                <button class="chip" onclick="askChip(this)">Summarise breaches against target</button>
                <button class="chip" onclick="askChip(this)">Any complaint trends I should know?</button>
            </div>
            <div class="chat-body" id="chatBody"></div>
            <div class="chat-input">
                <input id="chatInput" placeholder="Ask anything about this period..." autocomplete="off" maxlength="2000">
                <button class="btn btn-primary" id="chatSendBtn" onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

<script>
const API_BASE_URL = typeof window !== 'undefined' ? window.location.origin : '';
let currentAdmin = null;
let _chatBusy = false;
const _chatHistory = [];

function checkLogin() {
    const loggedIn = sessionStorage.getItem('loggedInUser');
    if (!loggedIn) { window.location.href = '/'; return null; }
    const user = JSON.parse(loggedIn);
    if (user.role !== 'admin') { window.location.href = '/'; return null; }
    return user;
}
function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
function setLoading(btn, loading) {
    if (!btn) return;
    if (loading) { btn._origText = btn.textContent; btn.textContent = 'Processing...'; btn.disabled = true; }
    else { btn.textContent = btn._origText || btn.textContent; btn.disabled = false; }
}
function showToast(message, type) {
    const c = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'error' ? ' error' : '');
    el.textContent = message;
    c.appendChild(el);
    setTimeout(function() { el.classList.add('hiding'); setTimeout(function() { el.remove(); }, 300); }, 2600);
}
async function goBackToAdmin() {
    try {
        const res = await fetch(`${API_BASE_URL}/api/admin/admin-token`);
        const data = await res.json();
        window.location.href = data.url || '/';
    } catch (e) { window.location.href = '/'; }
}
async function goToSLA() {
    try {
        const res = await fetch(`${API_BASE_URL}/api/admin/sla-token`);
        const data = await res.json();
        window.location.href = data.url || '/';
    } catch (e) { window.location.href = '/'; }
}
async function goToCustomers() {
    try {
        const res = await fetch(`${API_BASE_URL}/api/admin/customers-token`);
        const data = await res.json();
        window.location.href = data.url || '/';
    } catch (e) { window.location.href = '/'; }
}
async function goToBenchmarks() {
    try {
        const res = await fetch(`${API_BASE_URL}/api/admin/benchmarks-token`);
        const data = await res.json();
        window.location.href = data.url || '/';
    } catch (e) { window.location.href = '/'; }
}
async function goToBottlenecks() {
    try {
        const res = await fetch(`${API_BASE_URL}/api/admin/bottlenecks-token`);
        const data = await res.json();
        window.location.href = data.url || '/';
    } catch (e) { window.location.href = '/'; }
}
async function goToReports() {
    try {
        const res = await fetch(`${API_BASE_URL}/api/admin/reports-token`);
        const data = await res.json();
        window.location.href = data.url || '/';
    } catch (e) { window.location.href = '/'; }
}
function isoDay(d) { return d.toISOString().slice(0, 10); }
function fmtTime(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
}
function renderLite(text) {
    // Minimal safe formatting: paragraphs + "- " bullets. All HTML escaped first.
    const safe = escapeHtml(text == null ? '' : text);
    const blocks = safe.split(/\n\s*\n/);
    return blocks.map(function(b) {
        const lines = b.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
        if (lines.length && lines.every(function(l) { return /^[-*•]\s/.test(l); })) {
            return '<ul>' + lines.map(function(l) { return '<li>' + l.replace(/^[-*•]\s/, '') + '</li>'; }).join('') + '</ul>';
        }
        return '<p>' + lines.join('<br>') + '</p>';
    }).join('');
}
function scrollChat() {
    const body = document.getElementById('chatBody');
    body.scrollTop = body.scrollHeight;
}
function addUserMsg(text) {
    const body = document.getElementById('chatBody');
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = renderLite(text) + `<div class="msg-meta">You</div>`;
    body.appendChild(el);
    scrollChat();
}
function addAiMsg(text, meta) {
    const body = document.getElementById('chatBody');
    const el = document.createElement('div');
    el.className = 'msg ai';
    el.innerHTML = renderLite(text) + (meta ? `<div class="msg-meta">${escapeHtml(meta)}</div>` : '');
    body.appendChild(el);
    scrollChat();
    return el;
}
function showTyping() {
    const body = document.getElementById('chatBody');
    const el = document.createElement('div');
    el.className = 'msg ai';
    el.id = 'typingMsg';
    el.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    body.appendChild(el);
    scrollChat();
}
function hideTyping() {
    const el = document.getElementById('typingMsg');
    if (el) el.remove();
}
function askChip(btn) {
    document.getElementById('chatInput').value = btn.textContent;
    sendChat();
}
async function sendChat() {
    if (_chatBusy) return;
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('chatSendBtn');
    const message = (input.value || '').trim();
    if (!message) { showToast('Type a question first', 'error'); return; }
    const from = document.getElementById('aiFrom').value;
    const to = document.getElementById('aiTo').value;
    _chatBusy = true;
    setLoading(btn, true);
    addUserMsg(message);
    input.value = '';
    showTyping();
    try {
        const res = await fetch(`${API_BASE_URL}/api/admin/ai-chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, from, to, history: _chatHistory.slice(-6) })
        });
        const data = await res.json();
        hideTyping();
        if (!data.success) {
            addAiMsg(data.message || 'The analyst is unavailable right now. Please try again.');
            return;
        }
        const p = data.period || {};
        const meta = `Analyst · ${data.provider || 'AI'} · ${fmtTime(data.generated_at)} · figures ${p.from || ''} to ${p.to || ''}`;
        addAiMsg(data.reply, meta);
        document.getElementById('aiPeriodLbl').textContent = `Figures: ${p.from || ''} → ${p.to || ''}`;
        _chatHistory.push({ role: 'user', content: message });
        _chatHistory.push({ role: 'assistant', content: data.reply });
        while (_chatHistory.length > 6) _chatHistory.shift();
    } catch (e) {
        hideTyping();
        addAiMsg('Network error. Please check your connection and try again.');
    } finally {
        _chatBusy = false;
        setLoading(btn, false);
    }
}

document.getElementById('chatInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendChat();
});

currentAdmin = checkLogin();
if (currentAdmin) {
    const t = new Date();
    document.getElementById('aiTo').value = isoDay(t);
    document.getElementById('aiFrom').value = isoDay(new Date(t.getTime() - 29 * 86400000));
    addAiMsg('Hello. I read live system figures for any period you pick above. Ask me who served most, which service is busiest, when peaks hit, how breaches look against target, or anything else in the data.', 'Analyst · ready');
}
</script>
</body>
</html>
